name: Fix mobile JSX tail
on:
  push:
    branches: [develop]
    paths: ['scripts/fix-mobile-tail.cjs']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-mobile-tail.cjs
      - run: |
          git config user.name "ANISE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "fix: place mobile quick actions inside app shell"
          git push
