name: Repair ANISE Flow build

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Replace malformed Dashboard JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          start = text.index('function Dashboard(')
          end = text.index('function Stat(', start)
          replacement = r'''function Dashboard({people,stats,followups,navigate,onQuickUpdate,onAddDoctor}){const today=followups.filter(f=>!f.completed_at&&new Date(f.due_at).toDateString()===new Date().toDateString()).slice(0,4);const pipeline=Object.entries(statusLabels).slice(0,6).map(([key,label])=>({key,label,count:people.filter(p=>p.status===key).length}));return <><section className="hero-row"><div><p className="eyebrow">ANISE OUTREACH</p><h1>Good afternoon.</h1><p className="muted">Your real prospect activity, in one place.</p></div><div className="dashboard-actions"><button className="secondary-btn" onClick={onQuickUpdate}><Zap size={15}/> Log update</button><button className="add-btn" onClick={onAddDoctor}><CirclePlus size={15}/> Add doctor</button></div></section><section className="stats-grid"><Stat label="Total prospects" value={stats.total} note="Your private database" icon={Users} onClick={()=>navigate('People')}/><Stat label="High priority" value={stats.high} note="Needs attention" icon={Target} accent onClick={()=>navigate('People',{status:'all',priority:'high'})}/><Stat label="Interested" value={stats.interested} note="Current pipeline" icon={MessageCircle} onClick={()=>navigate('People',{status:'interested',priority:'all'})}/><Stat label="Follow-ups due" value={stats.due} note="Needs attention now" icon={CalendarClock} onClick={()=>navigate('Follow-ups')}/></section><div className="section-grid"><section className="panel wide"><div className="panel-head"><div><p className="eyebrow">ACTION QUEUE</p><h2>Today</h2></div><button className="text-btn" onClick={()=>navigate('Follow-ups')}>See all <ChevronRight size={15}/></button></div>{today.length?today.map(f=><button className="task task-button" key={f.id} onClick={()=>navigate('Follow-ups')}><div className="task-dot"/><div className="task-main"><strong>{f.prospects?.name||'Prospect'}</strong><span>{f.title}</span></div><time>{new Date(f.due_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</time></button>):<Empty text="No follow-ups due today."/>}</section><section className="panel"><div className="panel-head"><div><p className="eyebrow">RECENT</p><h2>People</h2></div><button className="text-btn" onClick={()=>navigate('People')}>All people <ChevronRight size={15}/></button></div>{people.slice(0,5).map(p=><button className="person-mini person-mini-button" key={p.id} onClick={()=>navigate('People')}><div className="avatar soft">{initials(p.name)}</div><div><strong>{p.name}</strong><span>{p.speciality||'Speciality not set'} · {p.status} · {p.priority||'medium'} priority</span></div></button>)}{!people.length&&<Empty text="Add your first doctor."/>}</section></div><section className="panel"><div className="panel-head"><div><p className="eyebrow">PIPELINE</p><h2>Outreach progress</h2></div><button className="text-btn" onClick={()=>navigate('Pipeline')}>Open pipeline <ChevronRight size={15}/></button></div><div className="pipeline-summary">{pipeline.map(item=><button className="pipeline-item pipeline-item-button" key={item.key} onClick={()=>navigate('Pipeline')}><span>{item.label}</span><strong>{item.count}</strong><span className="bar"><i style={{width:`${stats.total?Math.min(100,item.count/stats.total*100):0}%`}}/></span></button>)}</div></section></>}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit repaired source and remove repair workflow
        run: |
          rm -f .github/workflows/fix-app-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/fix-app-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair dashboard JSX build"
          git push origin HEAD:develop
