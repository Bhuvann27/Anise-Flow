name: Apply mobile UI patch
on:
  push:
    branches: [develop]
    paths: ['scripts/patch-mobile-ui.cjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-mobile-ui.cjs
      - run: |
          git config user.name "ANISE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "fix: improve mobile navigation and notifications"
          git push
