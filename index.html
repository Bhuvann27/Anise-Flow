<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101214" />
    <meta name="description" content="ANISE Flow private outreach CRM" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ANISE Flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const getGreeting = () => {
          const hour = new Date().getHours();
          if (hour >= 5 && hour < 12) return 'Good morning.';
          if (hour >= 12 && hour < 17) return 'Good afternoon.';
          if (hour >= 17 && hour < 22) return 'Good evening.';
          return 'Good night.';
        };

        const updateGreeting = () => {
          const heading = Array.from(document.querySelectorAll('h1')).find(el =>
            /^Good (morning|afternoon|evening|night)\.$/.test(el.textContent.trim())
          );
          if (heading) heading.textContent = getGreeting();
        };

        new MutationObserver(updateGreeting).observe(document.getElementById('root'), {
          childList: true,
          subtree: true,
          characterData: true
        });
        updateGreeting();
        setInterval(updateGreeting, 60000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
